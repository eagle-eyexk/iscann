openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: scan
    description: Website security scanning operations
  - name: assets
    description: Authorized website assets owned by the signed-in user
paths:
  /assets:
    get:
      operationId: listAssets
      tags: [assets]
      summary: List the signed-in user's active assets
      responses:
        "200":
          description: Authorized assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createAsset
      tags: [assets]
      summary: Register a website the user is authorized to assess
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssetRequest"
      responses:
        "201":
          description: Authorized asset created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          description: Invalid asset or authorization not confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Website already exists in the user's active assets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /assets/{id}/archive:
    post:
      operationId: archiveAsset
      tags: [assets]
      summary: Archive one of the signed-in user's assets
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Asset archived
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /scan:
    post:
      operationId: runScan
      tags: [scan]
      summary: Queue a passive scan for one of the signed-in user's authorized assets
      description: Creates a persistent scan job and returns immediately. The worker performs passive HTTP, TLS, DNS, cookie, and content checks only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanRequest"
      responses:
        "202":
          description: Scan job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanJob"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Authorized asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: An active scan already exists for this asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /scan/recent:
    get:
      operationId: listRecentScans
      tags: [scan]
      summary: List the most recent scans (newest first)
      responses:
        "200":
          description: Recent scans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScanSummary"
  /scan/stats:
    get:
      operationId: getScanStats
      tags: [scan]
      summary: Aggregated stats across all completed scans
      responses:
        "200":
          description: Aggregated stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanStats"
  /scan/jobs/{id}:
    get:
      operationId: getScanJob
      tags: [scan]
      summary: Get the status of one of the signed-in user's scan jobs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scan job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanJob"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Scan job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /scan/jobs/{id}/cancel:
    post:
      operationId: cancelScanJob
      tags: [scan]
      summary: Cancel one of the signed-in user's active scan jobs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Current or cancelled scan job state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanJob"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Scan job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /scan/{id}:
    get:
      operationId: getScan
      tags: [scan]
      summary: Get a stored scan report by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scan report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanReport"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    ScanRequest:
      type: object
      properties:
        assetId:
          type: integer
          description: ID of a website asset registered by the signed-in user after confirming authorization.
      required:
        - assetId
    ScanJob:
      type: object
      properties:
        id:
          type: integer
        assetId:
          type: integer
        scanId:
          type: integer
          nullable: true
        status:
          type: string
          enum: [queued, starting, running, finalizing, completed, failed, cancelled, timed_out]
        progress:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
        stage:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - assetId
        - scanId
        - status
        - progress
        - stage
        - error
        - createdAt
        - updatedAt
        - startedAt
        - completedAt
    CreateAssetRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        url:
          type: string
          description: Public http(s) website URL the signed-in user owns or is authorized to assess.
        authorizationConfirmed:
          type: boolean
          description: Must be true to record the user's authorization confirmation.
      required:
        - name
        - url
        - authorizationConfirmed
    Asset:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        url:
          type: string
        host:
          type: string
        createdAt:
          type: string
          format: date-time
        lastScannedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - name
        - url
        - host
        - createdAt
        - lastScannedAt
    Severity:
      type: string
      enum: [critical, high, medium, low, info]
    Finding:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        category:
          type: string
          description: e.g. "Headers", "TLS", "Cookies", "Exposure", "Content", "DNS"
        severity:
          $ref: "#/components/schemas/Severity"
        description:
          type: string
        evidence:
          type: string
          description: Short raw evidence (e.g. observed header value, file path).
        recommendation:
          type: string
      required:
        - id
        - title
        - category
        - severity
        - description
        - recommendation
    HeaderCheck:
      type: object
      properties:
        name:
          type: string
        present:
          type: boolean
        value:
          type: string
          nullable: true
        severity:
          $ref: "#/components/schemas/Severity"
        recommendation:
          type: string
      required:
        - name
        - present
        - severity
        - recommendation
    CookieInfo:
      type: object
      properties:
        name:
          type: string
        secure:
          type: boolean
        httpOnly:
          type: boolean
        sameSite:
          type: string
          nullable: true
      required:
        - name
        - secure
        - httpOnly
    TlsInfo:
      type: object
      properties:
        protocol:
          type: string
          nullable: true
        cipher:
          type: string
          nullable: true
        issuer:
          type: string
          nullable: true
        subject:
          type: string
          nullable: true
        validFrom:
          type: string
          nullable: true
        validTo:
          type: string
          nullable: true
        daysUntilExpiry:
          type: integer
          nullable: true
        san:
          type: array
          items:
            type: string
      required:
        - san
    DnsInfo:
      type: object
      properties:
        a:
          type: array
          items:
            type: string
        aaaa:
          type: array
          items:
            type: string
        mx:
          type: array
          items:
            type: string
        ns:
          type: array
          items:
            type: string
        txt:
          type: array
          items:
            type: string
        caa:
          type: array
          items:
            type: string
        hasSpf:
          type: boolean
        hasDmarc:
          type: boolean
      required:
        - a
        - aaaa
        - mx
        - ns
        - txt
        - caa
        - hasSpf
        - hasDmarc
    ExposedFile:
      type: object
      properties:
        path:
          type: string
        status:
          type: integer
        contentType:
          type: string
          nullable: true
        size:
          type: integer
          nullable: true
        risk:
          $ref: "#/components/schemas/Severity"
      required:
        - path
        - status
        - risk
    TechFingerprint:
      type: object
      properties:
        server:
          type: string
          nullable: true
        poweredBy:
          type: string
          nullable: true
        framework:
          type: string
          nullable: true
        cms:
          type: string
          nullable: true
        analytics:
          type: array
          items:
            type: string
        libraries:
          type: array
          items:
            type: string
        cdn:
          type: string
          nullable: true
      required:
        - analytics
        - libraries
    ContentChecks:
      type: object
      properties:
        title:
          type: string
          nullable: true
        hasMixedContent:
          type: boolean
        externalScripts:
          type: array
          items:
            type: string
        formsWithoutHttps:
          type: integer
        emailsFound:
          type: array
          items:
            type: string
        commentsLeaked:
          type: integer
          description: Count of HTML comments found that may leak info.
      required:
        - hasMixedContent
        - externalScripts
        - formsWithoutHttps
        - emailsFound
        - commentsLeaked
    InjectionCandidate:
      type: object
      properties:
        url:
          type: string
        method:
          type: string
          description: HTTP method (currently always GET).
        params:
          type: array
          items:
            type: string
          description: Query parameter names that look interesting for injection testing.
        kind:
          type: string
          description: Heuristic that flagged this URL (e.g. "php", "aspx", "id-param").
      required:
        - url
        - method
        - params
        - kind
    SqlmapResult:
      type: object
      properties:
        url:
          type: string
        param:
          type: string
          nullable: true
        vulnerable:
          type: boolean
        techniques:
          type: array
          items:
            type: string
          description: Detected injection technique tags (e.g. "boolean-based blind", "time-based blind").
        dbms:
          type: string
          nullable: true
          description: Database fingerprint reported by sqlmap, if any.
        evidence:
          type: string
          nullable: true
          description: Short snippet of relevant sqlmap output.
        durationMs:
          type: integer
        error:
          type: string
          nullable: true
          description: Reason the test could not complete, if any.
      required:
        - url
        - vulnerable
        - techniques
        - durationMs
    ActiveScanReport:
      type: object
      properties:
        enabled:
          type: boolean
        crawledUrls:
          type: integer
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/InjectionCandidate"
        sqlmapResults:
          type: array
          items:
            $ref: "#/components/schemas/SqlmapResult"
        sqlmapAvailable:
          type: boolean
        notes:
          type: array
          items:
            type: string
      required:
        - enabled
        - crawledUrls
        - candidates
        - sqlmapResults
        - sqlmapAvailable
        - notes
    RobotsInfo:
      type: object
      properties:
        present:
          type: boolean
        sensitiveDisallows:
          type: array
          items:
            type: string
        sitemapUrls:
          type: array
          items:
            type: string
      required:
        - present
        - sensitiveDisallows
        - sitemapUrls
    ScanReport:
      type: object
      properties:
        id:
          type: integer
        url:
          type: string
        finalUrl:
          type: string
        host:
          type: string
        scannedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
        score:
          type: integer
          description: Composite security score 0-100 (higher is safer).
        grade:
          type: string
          description: Letter grade A-F.
        statusCode:
          type: integer
        redirectChain:
          type: array
          items:
            type: string
        headers:
          type: array
          items:
            $ref: "#/components/schemas/HeaderCheck"
        rawHeaders:
          type: object
          additionalProperties:
            type: string
        cookies:
          type: array
          items:
            $ref: "#/components/schemas/CookieInfo"
        tls:
          $ref: "#/components/schemas/TlsInfo"
        dns:
          $ref: "#/components/schemas/DnsInfo"
        tech:
          $ref: "#/components/schemas/TechFingerprint"
        exposedFiles:
          type: array
          items:
            $ref: "#/components/schemas/ExposedFile"
        content:
          $ref: "#/components/schemas/ContentChecks"
        robots:
          $ref: "#/components/schemas/RobotsInfo"
        findings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
        active:
          $ref: "#/components/schemas/ActiveScanReport"
        aiSummary:
          type: string
          description: AI-generated executive summary of the scan in plain language.
        aiRemediation:
          type: array
          items:
            type: string
          description: AI-generated prioritized remediation steps.
      required:
        - id
        - url
        - finalUrl
        - host
        - scannedAt
        - durationMs
        - score
        - grade
        - statusCode
        - redirectChain
        - headers
        - rawHeaders
        - cookies
        - tls
        - dns
        - tech
        - exposedFiles
        - content
        - robots
        - findings
        - active
        - aiSummary
        - aiRemediation
    ScanSummary:
      type: object
      properties:
        id:
          type: integer
        url:
          type: string
        host:
          type: string
        scannedAt:
          type: string
          format: date-time
        score:
          type: integer
        grade:
          type: string
        criticalCount:
          type: integer
        highCount:
          type: integer
        mediumCount:
          type: integer
        lowCount:
          type: integer
      required:
        - id
        - url
        - host
        - scannedAt
        - score
        - grade
        - criticalCount
        - highCount
        - mediumCount
        - lowCount
    ScanStats:
      type: object
      properties:
        totalScans:
          type: integer
        averageScore:
          type: integer
        gradeDistribution:
          type: array
          items:
            type: object
            properties:
              grade:
                type: string
              count:
                type: integer
            required:
              - grade
              - count
        topIssues:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              category:
                type: string
              severity:
                $ref: "#/components/schemas/Severity"
              count:
                type: integer
            required:
              - title
              - category
              - severity
              - count
        recentSeverityCounts:
          type: object
          properties:
            critical:
              type: integer
            high:
              type: integer
            medium:
              type: integer
            low:
              type: integer
            info:
              type: integer
          required:
            - critical
            - high
            - medium
            - low
            - info
      required:
        - totalScans
        - averageScore
        - gradeDistribution
        - topIssues
        - recentSeverityCounts
